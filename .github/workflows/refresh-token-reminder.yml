name: Refresh Token Reminder

on:
  schedule:
    # 매월 1일, 15일 UTC 09:00에 실행 (토큰은 60일 유효하므로 여유있게 자주 체크)
    - cron: "0 9 1,15 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 토큰 갱신 시도 및 새 토큰 출력
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/refresh-token.js
